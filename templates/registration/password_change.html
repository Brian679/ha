{% extends 'portal/base_portal.html' %}{% block portal_content %}<div class="page-header"><div><h1>Change password</h1><p>Keep your account secure with a strong, unique password.</p></div></div><div class="form-layout"><form class="form-card" method="post">{% csrf_token %}<div class="form-grid" style="grid-template-columns:1fr">{% for field in form %}<div class="field"><label>{{ field.label }}</label>{{ field }}{{ field.errors }}{% if field.help_text %}<small class="helptext">{{ field.help_text }}</small>{% endif %}</div>{% endfor %}</div><div class="form-actions"><button class="btn btn-primary">Update password</button></div></form></div>{% endblock %}
